
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise for JO ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    <audio id="bgMusic" src="love-song.mp3" loop></audio>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffe0ec, #ffc2d8, #fff0f5);
            overflow: hidden;
            text-align: center;
        }

        .welcome-box {
            background: rgba(255,255,255,0.85);
            padding: 45px 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 35px rgba(180,50,100,0.2);
        }

        h1 {
            color: #c03970;
            font-size: 38px;
            margin-bottom: 20px;
        }

        p {
            color: #75435a;
            font-size: 19px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c03970;
            transform: scale(1.08);
        }

        .heart {
            font-size: 55px;
            margin-bottom: 20px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>

<body>

    <div class="welcome-box">
        <div class="heart">❤️</div>

        <h1>Hey JO!</h1>

        <p>
            I have something very special for you.
            A little surprise, made with lots of love.
        </p>

        <button onclick="startSurprise()">
            CLICK HERE JO ❤️
        </button>
    </div>

    <script>
    function startSurprise() {
        const music = document.getElementById("bgMusic");

        music.volume = 0.5;

        music.play().then(() => {
            window.location.href = "question.html";
        }).catch(() => {
            window.location.href = "question.html";
        });
    }
</script>

</body>
</html>
