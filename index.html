
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey JO ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
        }

        .welcome-box {
            width: 90%;
            max-width: 600px;
            padding: 30px;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="welcome-box">
        <div class="heart">❤️</div>

        <h1>Hey JO!</h1>

        <p>
            I have something very special for you.
            A little surprise, made with lots of love.
        </p>

        <button onclick="startSurprise()">
            CLICK HERE JO ❤️
        </button>

        <br><br>

       <div style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9999; background:white; padding:15px; border-radius:15px; width:90%; max-width:350px;">

    <p>🎵 Our Love Song ❤️</p>

    <audio id="bgMusic" controls loop style="width:100%;">
    <source src="love-song.mp3" type="audio/mpeg">
</audio>

</div> 
    </div>

   <script>
    function startSurprise() {
        const music = document.getElementById("bgMusic");

        if (music) {
            music.play().catch(() => {});
        }

        window.location.href = "question.html";
    }
</script> 

</body>
</html>
