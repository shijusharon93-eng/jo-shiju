
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Together ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        <audio id="bgMusic" src="love-song.mp3" autoplay loop></audio>

<script>
    const music = document.getElementById("bgMusic");
    music.volume = 0.5;

    music.play().catch(() => {
        document.addEventListener("click", () => {
            music.play();
        }, { once: true });
    });
</script>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffe0ec, #ffb6cf, #fff0f5);
            padding: 20px;
        }

        .box {
            background: white;
            padding: 45px 25px;
            border-radius: 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 35px rgba(180,50,100,0.2);
        }

        h1 {
            color: #d13d78;
            font-size: 38px;
        }

        p {
            color: #75435a;
            font-size: 21px;
            line-height: 1.7;
        }

        .heart {
            font-size: 65px;
            animation: beat 1s infinite;
        }

        button {
            background: #e75480;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #c03970;
            transform: scale(1.05);
        }

        @keyframes beat {
            50% { transform: scale(1.2); }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="heart">💖</div>

        <h1>Yahhhhh! ❤️</h1>

        <h2 style="color:#c03970;">
            Be my forever Better half!
        </h2>

        <p>
            I want to show some special moments of us 🥰
        </p>

        <p>
            Every moment with you is a beautiful memory
            that I want to keep forever.
        </p>

        <button onclick="window.location.href='photos.html'">
            See the freezed moments with you ❤️
        </button>

    </div>

</body>
</html>
